name: Supabase keepalive

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Lapisonis database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Call keepalive RPC
        shell: bash
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?Set SUPABASE_URL in repository secrets.}"
          : "${SUPABASE_API_KEY:?Set SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY in repository secrets.}"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST "${SUPABASE_URL%/}/rest/v1/rpc/app_keepalive" \
            --header "apikey: ${SUPABASE_API_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}')"

          printf '%s' "$response" | python3 -c 'import json, sys; data = json.load(sys.stdin); raise SystemExit(0 if data.get("success") else "Keepalive RPC failed")'

          echo "Supabase keepalive succeeded."
